services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: ainative-pgvector
    environment:
      POSTGRES_DB: ainative
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ainative"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack-pro:
    image: localstack/localstack-pro:latest
    container_name: ainative-localstack-pro
    environment:
      SERVICES: dynamodb,sqs,bedrock
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: 1
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    volumes:
      - "${HOME}/.localstack:/root/.localstack:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  ai-native-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ainative-spring-app
    depends_on:
      pgvector:
        condition: service_healthy
      localstack-pro:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgvector:5432/ainative
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AWS_ENDPOINT_OVERRIDE: http://localstack-pro:4566
      AWS_REGION: us-east-1
      AUDIT_TABLE_NAME: AppAiAuditTrail
      APPROVAL_QUEUE_URL: http://localstack-pro:4566/000000000000/agent-hitl-approval-queue
    ports:
      - "8080:8080"
